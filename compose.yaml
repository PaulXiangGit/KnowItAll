version: "2.4"

services:
  api:
    build: .
    environment:
      KNOWITALL_API_HOST: 0.0.0.0
      KNOWITALL_POSTGRES_DSN: postgresql://knowitall:knowitall@postgres:5432/knowitall
      KNOWITALL_REDIS_URL: redis://redis:6379/0
      KNOWITALL_OBJECT_STORE_BACKEND: local
      KNOWITALL_LOCAL_OBJECT_STORE_PATH: /app/.data/objects
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - knowitall-objects:/app/.data/objects

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: knowitall
      POSTGRES_PASSWORD: knowitall
      POSTGRES_DB: knowitall
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - knowitall-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowitall -d knowitall"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - knowitall-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  knowitall-postgres:
  knowitall-redis:
  knowitall-objects:
