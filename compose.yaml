version: "2.4"

services:
  api:
    build: .
    environment:
      KNOWITALL_API_HOST: 0.0.0.0
      KNOWITALL_POSTGRES_DSN: postgresql://knowitall:knowitall@postgres:5432/knowitall
      KNOWITALL_REDIS_URL: redis://redis:6379/0
      KNOWITALL_S3_ENDPOINT: http://minio:9000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: knowitall
      POSTGRES_PASSWORD: knowitall
      POSTGRES_DB: knowitall
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - knowitall-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowitall -d knowitall"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - knowitall-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: knowitall
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - knowitall-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  knowitall-postgres:
  knowitall-redis:
  knowitall-minio:
